[project]
name = "treap-map"
version = "0.1.1"
description = "A randomized binary search tree using heap-ordered priorities that supports insertion, deletion, split, merge, and ordered statistics in expected logarithmic time."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
